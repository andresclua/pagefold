name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A minimal repo, StackBlitz or the steps to reproduce.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pagefold version
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
