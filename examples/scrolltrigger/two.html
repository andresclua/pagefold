<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chapter two · ScrollTrigger</title>
  <meta name="description" content="No trigger is left behind">
  <link rel="stylesheet" href="../_lib/fade.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <strong>Scroll</strong>
    <nav>
      <a href="index.html">One</a>
      <a href="two.html">Two</a>
      <a href="three.html">Three</a>
    </nav>
  </header>
  <main id="pagefold" class="transition-fade">
    <h1>No trigger is left behind</h1>
    <p class="lead">Chapter two · 4 blocks. Scroll down.</p>
    <section class="reveal" data-reveal><i style="background:#1b1bff"></i><p>This page has a different number of blocks.</p></section>
    <section class="reveal" data-reveal><i style="background:#00ff9c"></i><p>The counter goes down and up with the page.</p></section>
    <section class="reveal" data-reveal><i style="background:#7c5cff"></i><p>It never adds up from one visit to the next.</p></section>
    <section class="reveal" data-reveal><i style="background:#ff5c8a"></i><p>That is what pagefold.mount takes care of.</p></section>
  </main>
  <div id="status" role="status">ScrollTriggers alive: <b id="triggers">0</b></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
  <script src="../_lib/pagefold.js"></script>
  <script src="main.js"></script>
</body>
</html>
